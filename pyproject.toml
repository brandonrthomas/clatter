[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clatter-bus"
version = "0.1.1"
description = "Real-time message bus for Claude Code sessions — one asks, another wakes and answers, hands-free."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Brandon Thomas", email = "brandon.thomas.r@gmail.com" }]
keywords = ["claude", "claude-code", "tmux", "message-bus", "agents", "ipc", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Communications",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/brandonrthomas/clatter"
Repository = "https://github.com/brandonrthomas/clatter"
Issues = "https://github.com/brandonrthomas/clatter/issues"

[project.scripts]
clatter = "clatter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["clatter"]

# Bundle the bash tool inside the package (keeps the standalone git-clone install working too).
[tool.hatch.build.targets.wheel.force-include]
"scripts" = "clatter/_assets/scripts"
"relay" = "clatter/_assets/relay"
"systemd" = "clatter/_assets/systemd"
"commands" = "clatter/_assets/commands"
"install.sh" = "clatter/_assets/install.sh"
"uninstall.sh" = "clatter/_assets/uninstall.sh"
"manual-patterns.example" = "clatter/_assets/manual-patterns.example"
"peers.example" = "clatter/_assets/peers.example"

[tool.hatch.build.targets.sdist]
include = [
  "/clatter",
  "/scripts",
  "/relay",
  "/systemd",
  "/commands",
  "/install.sh",
  "/uninstall.sh",
  "/manual-patterns.example",
  "/peers.example",
  "/README.md",
  "/ARCHITECTURE.md",
  "/LICENSE",
]
